name: Diyor CTR 24/7 Serverless Reels & Brand Studio ($0.00 Runner)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video va karusel mavzusi"
        required: true
        default: "Bir kishilik AI-Imperiya (Vibe Coding + Claude Skills)"
      keyword:
        description: "Follow-Gate Direct kalit so'zi (bo'sh qolsa AI mavzuga mos so'z tanlaydi)"
        required: false
        default: ""
      duration_sec:
        description: "Video davomiyligi (15 = qisqa, 44 = to'liq 7-sahnali)"
        required: true
        default: "17"
      video_mode:
        description: "Yo'nalish: auto | edu (1-O'rganish + Gate) | news (2-Yangilik va Prosmotr, Gate'siz)"
        required: false
        default: "auto"
      chat_id:
        description: "Telegram Chat ID"
        required: true
        default: "7179261501"

jobs:
  render_and_deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Repozitoriyni yuklash
        uses: actions/checkout@v4

      - name: Python 3.11 va pip kesh
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: /home/user muhitini tayyorlash
        run: |
          sudo mkdir -p /home/user/.cache/diyor_vault/tmp /home/user/.cache/diyor_vault/matte_cache /home/user/.cache/u2net_models /home/user/uploads
          sudo chown -R "$USER:$USER" /home/user
          ln -sfn "$GITHUB_WORKSPACE" /home/user/claude-techbrief
          if [ -f "$GITHUB_WORKSPACE/uploads/IMG_2860.jpeg" ]; then
            cp -f "$GITHUB_WORKSPACE/uploads/IMG_2860.jpeg" /home/user/uploads/IMG_2860.jpeg
          fi
          if [ -f "$GITHUB_WORKSPACE/uploads/IMG_2860_DIYOR_CTR.jpg" ]; then
            cp -f "$GITHUB_WORKSPACE/uploads/IMG_2860_DIYOR_CTR.jpg" /home/user/uploads/IMG_2860_DIYOR_CTR.jpg
          fi

      - name: u2net va Clawd sprite keshini tiklash
        uses: actions/cache@v4
        with:
          path: |
            /home/user/.cache/u2net_models
            /home/user/.cache/diyor_vault/clawd_bank_v1
            /home/user/.cache/diyor_vault/matte_cache
            ~/.cache/pip
          key: diyor-ctr-studio-cache-v1

      - name: Sistemali kutubxonalar va Playwright Chromium
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg rubberband-cli libsndfile1 fonts-dejavu-core
          pip install --upgrade pip
          pip install playwright pillow opencv-python-headless numpy scipy rembg onnxruntime edge-tts pedalboard soundfile imageio-ffmpeg aiohttp
          playwright install --with-deps chromium

      - name: 9:16 Reels (1080x1920) + 4:5 Muqova Render va Telegram'ga Yuborish
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          RENDER_TOPIC: ${{ github.event.inputs.topic }}
          RENDER_KEYWORD: ${{ github.event.inputs.keyword }}
          RENDER_DURATION: ${{ github.event.inputs.duration_sec }}
          RENDER_MODE: ${{ github.event.inputs.video_mode }}
          RENDER_CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: |
          python3 - <<'PY'
          import asyncio, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("/home/user/claude-techbrief/engine").resolve()))
          from autopilot_conveyor import run_one_click_autopilot

          async def main():
              out_d = Path("/home/user/.cache/diyor_vault/gh_out")
              res = await run_one_click_autopilot(
                  topic=os.environ.get("RENDER_TOPIC", "2026 yilgi eng muhim AI yangiliklari"),
                  keyword=os.environ.get("RENDER_KEYWORD", ""),
                  out_dir=out_d,
                  voice_profile="modal_bariton_hd",
                  with_subtitles=True,
                  target_duration=float(os.environ.get("RENDER_DURATION", "17")),
                  video_mode=os.environ.get("RENDER_MODE", "auto"),
              )
              tok = (os.environ.get("TG_BOT_TOKEN") or "").strip()
              if not tok:
                  raise RuntimeError("TG_BOT_TOKEN secret topilmadi!")
              cid = os.environ.get("RENDER_CHAT_ID", "7179261501")
              v_mode = res.get("video_mode", "edu")
              mode_lbl = "📢 Yangilik & Prosmotr (Gate'siz)" if v_mode == "news" else f"🎓 O'rganish & Gate («{res['keyword']}»)"
              subprocess.run([
                  "curl", "-f", "-sS", "-F", f"chat_id={cid}",
                  "-F", f"document=@{res['cover_png']}",
                  "-F", f"caption=🖼 [Arenasiz 24/7 Cloud] 4:5 Muqova · {mode_lbl}",
                  f"https://api.telegram.org/bot{tok}/sendDocument"
              ], check=True)
              subprocess.run([
                  "curl", "-f", "-sS", "-F", f"chat_id={cid}", "-F", "supports_streaming=true",
                  "-F", f"video=@{res['reel_mp4']}",
                  "-F", f"caption=🎬 [Arenasiz 24/7 Cloud] 9:16 Reel · {res['duration']}s · {mode_lbl}",
                  f"https://api.telegram.org/bot{tok}/sendVideo"
              ], check=True)
              subprocess.run([
                  "curl", "-f", "-sS", "-X", "POST",
                  f"https://api.telegram.org/bot{tok}/sendMessage",
                  "-d", f"chat_id={cid}",
                  "--data-urlencode", f"text=📋 Tayyor Instagram Caption ({mode_lbl}):\n\n{res['caption']}",
              ], check=True)
              print("ALL DELIVERED TO TELEGRAM:", res["duration"], "sec", v_mode)

          asyncio.run(main())
          PY
